version: '3.8'

services:
  nextjs:
    container_name: nextjs-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3000:3000'  # Только localhost
    environment:
      - NODE_ENV=production
      # Адрес бэкенда для запросов, которые Next делает НА СЕРВЕРЕ.
      # Идём прямо в контейнер .NET по внутренней сети: публичный домен
      # увёл бы запрос в Cloudflare и вернул петлёй на эту же машину.
      # См. docs/server-side-api-direct.md.
      - INTERNAL_API_URL=http://webshop
      # - HTTP_PROXY=http://86.107.45.211:3128
      # - HTTPS_PROXY=http://86.107.45.211:3128
    restart: always
    networks:
      - default
      - shop-network

networks:
  # Сеть проекта I-STORE, где живёт контейнер webshop. Создаётся не здесь,
  # поэтому external: поднимать магазин надо после бэкенда.
  shop-network:
    external: true
    name: i-store_shop-network
